name: Native checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.0'
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Install the official RN 0.86.3 Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Compile debug APK without release credentials
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RCT_NO_LAUNCH_PACKAGER: '1'
      FORCE_BUNDLING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.0'
          cache: npm
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '3.3'
      - run: npm ci
      - name: Resolve CocoaPods tooling
        run: bundle install --jobs 4 --retry 3
      - name: Audit Ruby dependencies
        run: bundle exec bundler-audit check --update
      - name: Install native pods
        working-directory: ios
        run: bundle exec pod install
      - name: Expose resolved native locks for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lockfiles
          path: |
            Gemfile.lock
            ios/Podfile.lock
          if-no-files-found: error
          retention-days: 7
      - name: Select an available iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          SIMULATOR_ID=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/simulators.json")); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Build and test the bundled app on an unsigned iOS simulator
        run: >-
          xcodebuild test
          -workspace ios/ReactNativeStarter.xcworkspace
          -scheme ReactNativeStarter
          -configuration Debug
          -destination "id=$SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/react-native-build"
          -resultBundlePath "$RUNNER_TEMP/native-tests.xcresult"
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=

      - name: Export Home screenshot attachments
        run: >-
          xcrun xcresulttool export attachments
          --path "$RUNNER_TEMP/native-tests.xcresult"
          --output-path "$RUNNER_TEMP/native-screenshots"
      - name: Retain compact iOS screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ios-screenshots
          path: ${{ runner.temp }}/native-screenshots
          if-no-files-found: error
          retention-days: 7
